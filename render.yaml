services:
  - type: web
    name: devflow-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: DEVFLOW_COOKIE_SECURE
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: devflow-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./apps/web/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DEVFLOW_API_HOSTPORT
        fromService:
          name: devflow-api
          type: web
          property: hostport
